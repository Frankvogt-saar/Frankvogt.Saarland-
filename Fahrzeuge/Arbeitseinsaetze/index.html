
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbeitseinsätze – Frank Vogt</title>
  <link rel="stylesheet" href="../../style.css">

  <style>
    .gallery-status {
      color: var(--muted);
      margin-top: 18px;
    }

    .tile img {
      object-fit: cover;
      background: #111;
    }

    .video-tile {
      min-width: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #090b0e;
      border: 1px solid var(--accent);
    }

    .video-tile video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #090b0e;
    }
  </style>
</head>

<body>
  <nav class="nav">
    <a class="logo" href="../../">Frank Vogt</a>
    <button class="menu" id="menuButton" aria-label="Menü öffnen">☰</button>
    <div class="navlinks" id="navlinks">
      <a href="../../">Startseite</a>
      <a href="../">Fahrzeuge</a>
      <a href="../Traktoren/">Traktoren</a>
      <a href="../Ausstellungen/">Ausstellungen</a>
    </div>
  </nav>

  <div class="breadcrumb">
    <a href="../../">Startseite</a> /
    <a href="../">Fahrzeuge</a> / Arbeitseinsätze
  </div>

  <main class="gallery">
    <div class="gallery-head">
      <div>
        <div class="eyebrow">Frank Vogt · Fotogalerie</div>
        <h2>Arbeitseinsätze</h2>
      </div>
      <div class="count" id="photoCount">Medien werden geladen …</div>
    </div>

    <p class="lead">Fotos und Videos von Arbeitseinsätzen.</p>

    <div class="grid" id="photoGrid" aria-label="Foto- und Videogalerie"></div>
    <p class="gallery-status" id="galleryStatus">Medien werden geladen …</p>
  </main>

  <footer>Frank Vogt · Fotogalerie</footer>

  <div class="lightbox" id="lightbox" aria-label="Bildansicht">
    <button class="close" id="closeButton" aria-label="Schließen">×</button>
    <button class="prev" id="prevButton" aria-label="Vorheriges Foto">‹</button>
    <img id="largeImage" alt="Foto in Großansicht">
    <button class="next" id="nextButton" aria-label="Nächstes Foto">›</button>
  </div>

  <script>
    const grid = document.getElementById("photoGrid");
    const count = document.getElementById("photoCount");
    const status = document.getElementById("galleryStatus");
    const lightbox = document.getElementById("lightbox");
    const largeImage = document.getElementById("largeImage");

    let photos = [];
    let current = 0;

    function fileUrl(name) {
      return name.split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
    }

    function openPhoto(index) {
      if (!photos.length) return;

      current = (index + photos.length) % photos.length;
      largeImage.src = fileUrl(photos[current]);
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closePhoto() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
      largeImage.removeAttribute("src");
    }

    document.getElementById("closeButton")
      .addEventListener("click", closePhoto);

    document.getElementById("prevButton")
      .addEventListener("click", () => openPhoto(current - 1));

    document.getElementById("nextButton")
      .addEventListener("click", () => openPhoto(current + 1));

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closePhoto();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePhoto();

      if (lightbox.classList.contains("open")) {
        if (event.key === "ArrowLeft") openPhoto(current - 1);
        if (event.key === "ArrowRight") openPhoto(current + 1);
      }
    });

    document.getElementById("menuButton")
      .addEventListener("click", () => {
        document.getElementById("navlinks").classList.toggle("open");
      });

    async function loadMedia() {
      try {
        const [imageResponse, videoResponse] = await Promise.all([
          fetch("bilder.json", { cache: "no-store" }),
          fetch("videos.json", { cache: "no-store" })
        ]);

        if (!imageResponse.ok) {
          throw new Error("Bilderliste fehlt");
        }

        const imageFiles = await imageResponse.json();

        let videoFiles = [];

        if (videoResponse.ok) {
          videoFiles = await videoResponse.json();
        }

        photos = imageFiles.filter(
          name => typeof name === "string"
        );

        videoFiles = videoFiles.filter(
          name => typeof name === "string" &&
                  name.toLowerCase().endsWith(".mp4")
        );

        const media = [
          ...photos.map(name => ({ name, type: "image" })),
          ...videoFiles.map(name => ({ name, type: "video" }))
        ].sort((a, b) =>
          a.name.localeCompare(b.name, "de", {
            numeric: true,
            sensitivity: "base"
          })
        );

        grid.replaceChildren();

        count.textContent =
          media.length + (media.length === 1 ? " Medium" : " Medien");

        if (!media.length) {
          status.textContent =
            "In diesem Ordner wurden noch keine Fotos oder Videos gefunden.";
          return;
        }

        status.textContent = "";

        media.forEach(item => {
          if (item.type === "image") {
            const button = document.createElement("button");
            button.className = "tile";
            button.type = "button";
            button.setAttribute("aria-label", "Foto groß öffnen");

            const img = document.createElement("img");
            img.src = fileUrl(item.name);
            img.alt = "";
            img.loading = "lazy";

            img.addEventListener("error", () => {
              button.remove();
            });

            button.appendChild(img);
            button.addEventListener("click", () => {
              const photoIndex = photos.indexOf(item.name);
              if (photoIndex !== -1) openPhoto(photoIndex);
            });

            grid.appendChild(button);
          } else {
            const wrapper = document.createElement("div");
            wrapper.className = "video-tile";

            const video = document.createElement("video");
            video.src = fileUrl(item.name);
            video.controls = true;
            video.preload = "metadata";
            video.playsInline = true;
            video.setAttribute("aria-label", "Video abspielen");

            wrapper.appendChild(video);
            grid.appendChild(wrapper);
          }
        });
      } catch (error) {
        count.textContent = "Medienliste fehlt";
        status.textContent =
          "Die Bilderliste konnte nicht geladen werden. " +
          "Bitte prüfen, ob die GitHub-Aktion erfolgreich abgeschlossen wurde.";
        console.error(error);
      }
    }

    loadMedia();
  </script>
</body>
</html>
