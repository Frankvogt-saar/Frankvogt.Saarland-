<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traktoren – Aktuell | Frank Vogt</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    header {
      background: #26372c;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }

    nav {
      margin-top: 18px;
    }

    nav a {
      display: inline-block;
      color: white;
      margin: 5px 10px;
      text-decoration: none;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 24px 16px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    .tile {
      border: 0;
      padding: 0;
      background: white;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px #00000018;
    }

    .tile img {
      display: block;
      width: 100%;
      height: 175px;
      object-fit: cover;
      transition: transform .2s;
    }

    .tile:hover img {
      transform: scale(1.04);
    }

    .tile span {
      display: block;
      padding: 9px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000000ed;
      align-items: center;
      justify-content: center;
      padding: 55px 16px 20px;
    }

    #lightbox.open { display: flex; }

    #bigPhoto {
      max-width: 96vw;
      max-height: 88vh;
      object-fit: contain;
    }

    #close {
      position: absolute;
      top: 12px;
      right: 22px;
      color: white;
      background: transparent;
      border: 0;
      font-size: 38px;
      cursor: pointer;
    }

    #photoName {
      position: absolute;
      bottom: 10px;
      color: white;
      text-align: center;
      max-width: 95%;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .notice {
      padding: 20px;
      background: white;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h1>Traktoren – Aktuell</h1>
    <p>Fotogalerie von Frank Vogt</p>
    <nav>
      <a href="../../../">Startseite</a>
      <a href="../../">Fahrzeuge</a>
      <a href="../">Traktoren</a>
      <a href="../Ehemalig/">Ehemalig</a>
    </nav>
  </header>

  <main>
    <div id="gallery" class="gallery"></div>
    <p id="notice" class="notice" hidden></p>
  </main>

  <div id="lightbox" role="dialog" aria-modal="true"
       aria-label="Foto in Großansicht">
    <button id="close" aria-label="Foto schließen">&times;</button>
    <img id="bigPhoto" alt="">
    <div id="photoName"></div>
  </div>

  <footer>© Frank Vogt</footer>

  <script>
    /*
      Die Namen müssen exakt den Dateien im Ordner entsprechen.
      Bei Bedarf Dateinamen in dieser Liste korrigieren.
    */
    const fotos = [
      "SR3 Landpartie Birkenhof Handy-006.jpeg",
      "20150606 MF Fuhrpark-006.JPG",
      "20150829 Holzfahrt Hölschberg-038.JPG",
      "20150829 Holzfahrt Hölschberg-040.JPG",
      "20150829 Holzfahrt Hölschberg-044.JPG",
      "20160507 D 15 Anhänger-006.JPG",
      "20170107 Bucher Schneebesen 001.JPG",
      "20180407 Holzspalten Wiese MF 148 Halter-015.JPG",
      "20180421 Schmotzer aufhängen0-022.JPG",
      "20190518 Rapid Wiese mähen-002.JPG",
      "20200711 Minibagger Bach014.JPG",
      "20200725 Holzmachen Minibagger Holzgreifer-018.JPG",
      "20200725 Holzmachen Minibagger Holzgreifer-021.JPG",
      "20220326 Käferholz Transport MF 165 Fendt(30).JPG",
      "20250614 Kramer Radlader Lieferung (6).JPG",
      "35 Seite neu.jpg",
      "35 vorn alt 505.jpg",
      "Abtransport MF 30 Abholung MF 148 066.jpg",
      "Abtransport MF 30 Abholung MF 148 088.jpg",
      "Blank 02 alt.BMP",
      "Blank-Raupe 17.jpg",
      "Bucher 043.jpg",
      "Bucher Mäharbeiten 10.08.07 027.jpg",
      "Deutz D15 069.jpg",
      "FUHRPARK.JPG",
      "Fendt FWA 258S 001.jpg",
      "Fendt Farmer 106 Schnee 27.11.2010 010.jpg",
      "Garten Weinfassaktion u.a. 08.02.06 001.jpg",
      "Garten Weinfassaktion u.a. 08.02.06 002.jpg",
      "Garten Weinfassaktion u.a. 08.02.06 024.jpg",
      "Gutbrod Terra 4 PS 001.jpg",
      "Gutbrod Terra 4 PS 022.jpg",
      "Gutbrod Terra System 004.jpg",
      "HALTER.JPG",
      "Inhaber 1994 01.jpg",
      "Halter A10 beye 09-97 02.jpg",
      "Holder02.jpg",
      "Linde Gabelstapler 017.jpg",
      "MF 835 Restaurierung 2005 449.jpg",
      "MFneubmp.jpg",
      "Mimoki05.jpg",
      "Moki1.jpg",
      "Moki3.BMP",
      "MotoStandard.JPG",
      "Motorjapaner 16.10.05 019.jpg",
      "Motorjapaner 16.10.05 020.jpg",
      "Motorjapaner 16.10.05 022.jpg",
      "Potratz 19.12.2009 006.jpg",
      "Potratz Nils Roman 26.10.05 028.jpg",
      "Potratz Nils Roman 26.10.05 034.jpg",
      "Rapid 1.jpg",
      "Schmotzer 03.jpg",
      "Schmotzer Emil Grimm BW 2.jpg"
    ];

    const galerie = document.getElementById("gallery");
    const hinweis = document.getElementById("notice");
    const lightbox = document.getElementById("lightbox");
    const gross = document.getElementById("bigPhoto");
    const fotoName = document.getElementById("photoName");

    fotos.forEach(name => {
      const pfad = encodeURI(name);
      const knopf = document.createElement("button");
      knopf.className = "tile";
      knopf.type = "button";

      const bild = document.createElement("img");
      bild.src = pfad;
      bild.alt = name;
      bild.loading = "lazy";

      const beschriftung = document.createElement("span");
      beschriftung.textContent = name;

      bild.addEventListener("error", () => {
        knopf.remove();
        hinweis.hidden = false;
        hinweis.textContent =
          "Einige Fotos konnten nicht geladen werden. Bitte Dateinamen in der Fotoliste prüfen.";
      });

      knopf.append(bild, beschriftung);
      knopf.addEventListener("click", () => {
        gross.src = pfad;
        gross.alt = name;
        fotoName.textContent = name;
        lightbox.classList.add("open");
      });

      galerie.appendChild(knopf);
    });

    function schliessen() {
      lightbox.classList.remove("open");
      gross.src = "";
    }

    document.getElementById("close")
      .addEventListener("click", schliessen);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) schliessen();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") schliessen();
    });
  </script>
</body>
</html>
