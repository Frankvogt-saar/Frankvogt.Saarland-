<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traktoren – Frank Vogt</title>
  <link rel="stylesheet" href="../../style.css">
  <script type="text/javascript" src="https://ff.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=P_u4sl2AqeQyWWn1nkVndeID7tJX7iIs6-8vlaE_C6HS2UhHIzYu9TBRa2SxZm9NbDQ34IonGM6Eie2rlQM50Y7dTtVITKZLfuZf4rOuc_r2UfXZxMQH8OkLeRJ7bFSxfoHfEJXmZX567pSqy4tqTImQd0CC2c0FGcWaXuZZvYhFHJWjvaTwBJo1WhHhEb925Hl5m94G3xE9yLefChz-iq8fezYHTPlDCet2zwmyZ4rAsTXkI5oTj79wtjXj_loAuSXfUVljGNxDSb8smpcwsL0mzlPpHu2JeBSN5EhGiUlqqVk24xCqZxPuljT5rnRS" charset="UTF-8"></script><style>
    .tractor-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 28px 0;
    }
    .tractor-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 90px;
      padding: 22px 24px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      box-sizing: border-box;
    }
    .tractor-link:hover,
    .tractor-link:focus-visible {
      border-color: var(--text);
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="../../">Frank Vogt</a>
    <button class="menu" id="menuButton" aria-label="Menü öffnen">☰</button>
    <div class="navlinks" id="navlinks">
      <a href="../../">Startseite</a>
      <a href="../../Fotografie/">Fotografie</a>
      <a href="../../Fahrzeuge/">Fahrzeuge</a>
      <a href="../../Holzwerken/">Holzwerken</a>
      <a href="../../Musik/">Musik</a>
    </div>
  </nav>

  <div class="breadcrumb">
    <a href="../../">Startseite</a> / <a href="../">Fahrzeuge</a> / Traktoren
  </div>

  <main class="gallery">
    <div class="gallery-head">
      <div>
        <div class="eyebrow">Frank Vogt · Fotogalerie</div>
        <h2>Traktoren</h2>
      </div>
    </div>
    <p class="lead">Wähle aus, welche Traktoren-Galerie du ansehen möchtest.</p>

    <div class="tractor-links" aria-label="Traktoren-Galerien">
      <a class="tractor-link" href="Aktuell/">
        <span>Aktuell</span><span aria-hidden="true">→</span>
      </a>
      <a class="tractor-link" href="Ehemalig/">
        <span>Ehemalig</span><span aria-hidden="true">→</span>
      </a>
    </div>
  </main>

  <footer>Frank Vogt · Fotogalerie</footer>
  <script>
    const menuButton = document.getElementById('menuButton');
    const navlinks = document.getElementById('navlinks');
    if (menuButton && navlinks) {
      menuButton.addEventListener('click', () => navlinks.classList.toggle('open'));
    }
  </script>
</body>
</html>
