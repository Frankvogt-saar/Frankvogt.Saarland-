
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instrumentengalerie – Frank Vogt</title>
  <link rel="stylesheet" href="../../../style.css">
  <style>
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .media-grid .tile {
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }
    .media-grid .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #111;
    }
    .video-tile {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: #090b0e;
    }
    .video-tile video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #090b0e;
    }
    .gallery-status { color: var(--muted); margin-top: 18px; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="../../../">Frank Vogt</a>
    <button class="menu" id="menuButton" type="button"
      aria-label="Menü öffnen">☰</button>
    <div class="navlinks" id="navlinks">
      <a href="../../../">Startseite</a>
      <a href="../../../Fotografie/">Fotografie</a>
      <a href="../../../Fahrzeuge/">Fahrzeuge</a>
      <a href="../../../Holzwerken/">Holzwerken</a>
      <a href="../../">Musik</a>
    </div>
  </nav>

  <div class="breadcrumb">
    <a href="../../../">Startseite</a> /
    <a href="../../">Musik</a> /
    <a href="../">Instrumentenbau</a> /
    <span id="categoryName">Instrumente</span>
  </div>

  <main class="gallery">
    <div class="gallery-head">
      <div>
        <div class="eyebrow">Frank Vogt · Fotogalerie</div>
        <h2 id="pageTitle">Instrumentengalerie</h2>
      </div>
      <div class="count" id="mediaCount">Medien werden geladen …</div>
    </div>

    <p class="lead" id="intro">
      Fotos und Videos aus meinen Instrumentenbauprojekten.
    </p>

    <div class="grid media-grid" id="mediaGrid"></div>
    <p class="gallery-status" id="galleryStatus" role="status">
      Medien werden geladen …
    </p>
  </main>

  <footer>Frank Vogt · Fotogalerie</footer>

  <div class="lightbox" id="lightbox" aria-label="Bildansicht">
    <button class="close" id="closeButton" aria-label="Schließen">×</button>
    <button class="prev" id="prevButton" aria-label="Vorheriges Foto">‹</button>
    <img id="largeImage" alt="Foto in Großansicht">
    <button class="next" id="nextButton" aria-label="Nächstes Foto">›</button>
  </div>

  <script>

    const FOLDER = "Musik/Instrumentenbau/Schlaginstrumente";
    const TITLE = "3.1.2 Schlaginstrumente";
    const DESCRIPTION = "Fotos und Videos von Schlaginstrumenten.";

    const ROOT = "../../../";
    const grid = document.getElementById("mediaGrid");
    const count = document.getElementById("mediaCount");
    const status = document.getElementById("galleryStatus");
    const lightbox = document.getElementById("lightbox");
    const largeImage = document.getElementById("largeImage");

    document.getElementById("pageTitle").textContent = TITLE;
    document.getElementById("categoryName").textContent = TITLE;
    document.getElementById("intro").textContent = DESCRIPTION;

    let photos = [];
    let current = 0;

    function folderUrl(folder) {
      return ROOT + folder.split("/")
        .map(encodeURIComponent).join("/") + "/";
    }

    function fileUrl(name) {
      return folderUrl(FOLDER) + name.split("/")
        .map(encodeURIComponent).join("/");
    }

    function openPhoto(index) {
      if (!photos.length) return;
      current = (index + photos.length) % photos.length;
      largeImage.src = fileUrl(photos[current]);
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closePhoto() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
      largeImage.removeAttribute("src");
    }

    document.getElementById("closeButton")
      .addEventListener("click", closePhoto);
    document.getElementById("prevButton")
      .addEventListener("click", () => openPhoto(current - 1));
    document.getElementById("nextButton")
      .addEventListener("click", () => openPhoto(current + 1));

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closePhoto();
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;
      if (event.key === "Escape") closePhoto();
      if (event.key === "ArrowLeft") openPhoto(current - 1);
      if (event.key === "ArrowRight") openPhoto(current + 1);
    });

    document.getElementById("menuButton")
      .addEventListener("click", () => {
        document.getElementById("navlinks").classList.toggle("open");
      });

    async function loadMedia() {
      try {
        const base = folderUrl(FOLDER);
        const imageResponse = await fetch(base + "bilder.json", {
          cache: "no-store"
        });

        if (!imageResponse.ok) {
          throw new Error("bilder.json fehlt oder ist nicht erreichbar.");
        }

        const imageData = await imageResponse.json();
        if (!Array.isArray(imageData)) {
          throw new Error("bilder.json ist ungültig.");
        }

        const videoResponse = await fetch(base + "videos.json", {
          cache: "no-store"
        });

        let videoData = [];
        if (videoResponse.ok) {
          videoData = await videoResponse.json();
          if (!Array.isArray(videoData)) videoData = [];
        }

        photos = imageData.filter(name =>
          typeof name === "string" &&
          /\.(jpe?g|png|gif|webp|avif)$/i.test(name)
        );

        const videos = videoData.filter(name =>
          typeof name === "string" && /\.mp4$/i.test(name)
        );

        const media = [
          ...photos.map(name => ({ name, type: "image" })),
          ...videos.map(name => ({ name, type: "video" }))
        ].sort((a, b) => a.name.localeCompare(b.name, "de", {
          numeric: true,
          sensitivity: "base"
        }));

        grid.replaceChildren();
        count.textContent = media.length +
          (media.length === 1 ? " Medium" : " Medien");

        if (!media.length) {
          status.textContent =
            "Keine unterstützten Fotos oder MP4-Videos gefunden.";
          return;
        }

        status.textContent = "";

        media.forEach(item => {
          if (item.type === "image") {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "tile";
            button.setAttribute("aria-label", "Foto groß öffnen");

            const img = document.createElement("img");
            img.src = fileUrl(item.name);
            img.alt = "";
            img.loading = "lazy";

            img.addEventListener("error", () => button.remove());

            button.appendChild(img);
            button.addEventListener("click", () => {
              openPhoto(photos.indexOf(item.name));
            });
            grid.appendChild(button);
          } else {
            const wrapper = document.createElement("div");
            wrapper.className = "video-tile";

            const video = document.createElement("video");
            video.src = fileUrl(item.name);
            video.controls = true;
            video.preload = "metadata";
            video.playsInline = true;

            wrapper.appendChild(video);
            grid.appendChild(wrapper);
          }
        });
      } catch (error) {
        console.error(error);
        count.textContent = "Medienliste fehlt";
        status.textContent =
          "Die Medienliste konnte nicht geladen werden. " +
          "Bitte den GitHub-Workflow und bilder.json prüfen.";
      }
    }

    loadMedia();
  </script>
</body>
</html>
