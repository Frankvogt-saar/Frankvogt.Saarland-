<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3.1.1 Saiteninstrumente – Frank Vogt</title>
  <link rel="stylesheet" href="../../../style.css">
  <script type="text/javascript" src="https://ff.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=_J4j7Ah5ioZ7EpE2jwpjvFv5D7NUcf0sSupdt77NQ6qahDmkjmlDvOMcbtTgImbnmDzxYT-KrWA1UiTwa2OT0RUzpmh2PTC0oHZ4t09WzB5N1rQ1jDJ2Ph45sk7qNAY8PHUwQcgTUVj0S7xcitrh_XDRBw0d1vqgaleijoDbYAkFwiBOzrbcdM6AP1j5bS5jaFlpkfzHX2IIImrc8zNFbzZDMc9n4viq9ivXb6JAAHaWzCdf2ZVdHVqaQ5X5ce5yVu9o6EiD6idECCa02fFLFQ" charset="UTF-8"></script><style>
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .media-grid .tile {
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }
    .media-grid .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #111;
    }
    .video-tile {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: #090b0e;
    }
    .video-tile video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #090b0e;
    }
    .gallery-status { color: var(--muted); margin-top: 18px; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="../../../">Frank Vogt</a>
    <button class="menu" id="menuButton" type="button"
      aria-label="Menü öffnen" aria-expanded="false" aria-controls="navlinks">☰</button>
    <div class="navlinks" id="navlinks">
      <a href="../../../">Startseite</a>
      <a href="../../../Fotografie/">Fotografie</a>
      <a href="../../../Fahrzeuge/">Fahrzeuge</a>
      <a href="../../../Holzwerken/">Holzwerken</a>
      <a href="../../">Musik</a>
    </div>
  </nav>

  <div class="breadcrumb">
    <a href="../../../">Startseite</a> /
    <a href="../../">Musik</a> /
    <a href="../">Instrumentenbau</a> /
    Saiteninstrumente
  </div>

  <main class="gallery">
    <div class="gallery-head">
      <div>
        <div class="eyebrow">Frank Vogt · Fotogalerie</div>
        <h2>3.1.1 Saiteninstrumente</h2>
      </div>
      <div class="count" id="mediaCount">Medien werden geladen …</div>
    </div>

    <p class="lead">Fotos und Videos aus der Kategorie Saiteninstrumente.</p>
    <div class="grid media-grid" id="mediaGrid" aria-label="Foto- und Videogalerie"></div>
    <p class="gallery-status" id="galleryStatus" role="status">Medien werden geladen …</p>
  </main>

  <footer>Frank Vogt · Fotogalerie</footer>

  <div class="lightbox" id="lightbox" aria-label="Bildansicht">
    <button class="close" id="closeButton" type="button" aria-label="Schließen">×</button>
    <button class="prev" id="prevButton" type="button" aria-label="Vorheriges Foto">‹</button>
    <img id="largeImage" alt="Foto in Großansicht">
    <button class="next" id="nextButton" type="button" aria-label="Nächstes Foto">›</button>
  </div>

  <script>
    "use strict";

    const ROOT = "../../../";
    const FOLDER = "Musik/Instrumentenbau/Saiteninstrumente";

    const grid = document.getElementById("mediaGrid");
    const count = document.getElementById("mediaCount");
    const status = document.getElementById("galleryStatus");
    const lightbox = document.getElementById("lightbox");
    const largeImage = document.getElementById("largeImage");
    const menuButton = document.getElementById("menuButton");
    const navlinks = document.getElementById("navlinks");

    let photos = [];
    let current = 0;

    function folderUrl(folder) {
      return ROOT + folder.split("/").map(encodeURIComponent).join("/") + "/";
    }

    function fileUrl(name) {
      return folderUrl(FOLDER) +
        name.split("/").map(encodeURIComponent).join("/");
    }

    menuButton.addEventListener("click", () => {
      const isOpen = navlinks.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute("aria-label", isOpen ? "Menü schließen" : "Menü öffnen");
    });

    function openPhoto(index) {
      if (!photos.length || index < 0) return;
      current = (index + photos.length) % photos.length;
      largeImage.src = fileUrl(photos[current]);
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closePhoto() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
      largeImage.removeAttribute("src");
    }

    document.getElementById("closeButton").addEventListener("click", closePhoto);
    document.getElementById("prevButton").addEventListener("click", () => openPhoto(current - 1));
    document.getElementById("nextButton").addEventListener("click", () => openPhoto(current + 1));

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closePhoto();
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;
      if (event.key === "Escape") closePhoto();
      if (event.key === "ArrowLeft") openPhoto(current - 1);
      if (event.key === "ArrowRight") openPhoto(current + 1);
    });

    async function loadMedia() {
      try {
        const base = folderUrl(FOLDER);
        const [imageResponse, videoResponse] = await Promise.all([
          fetch(base + "bilder.json", { cache: "no-store" }),
          fetch(base + "videos.json", { cache: "no-store" })
        ]);

        if (!imageResponse.ok) {
          throw new Error("bilder.json fehlt oder ist nicht erreichbar.");
        }

        const imageData = await imageResponse.json();
        if (!Array.isArray(imageData)) {
          throw new Error("bilder.json enthält keine gültige Liste.");
        }

        let videoData = [];
        if (videoResponse.ok) {
          videoData = await videoResponse.json();
          if (!Array.isArray(videoData)) videoData = [];
        }

        photos = imageData.filter(name =>
          typeof name === "string" &&
          /\.(jpe?g|png|gif|webp|avif)$/i.test(name)
        );

        const videos = videoData.filter(name =>
          typeof name === "string" && /\.mp4$/i.test(name)
        );

        const media = [
          ...photos.map(name => ({ name, type: "image" })),
          ...videos.map(name => ({ name, type: "video" }))
        ].sort((a, b) => a.name.localeCompare(b.name, "de", {
          numeric: true,
          sensitivity: "base"
        }));

        grid.replaceChildren();

        if (!media.length) {
          count.textContent = "0 Medien";
          status.textContent = "Keine unterstützten Fotos oder MP4-Videos gefunden.";
          return;
        }

        status.textContent = "";

        media.forEach(item => {
          if (item.type === "image") {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "tile";
            button.setAttribute("aria-label", "Foto groß öffnen");

            const img = document.createElement("img");
            img.src = fileUrl(item.name);
            img.alt = "";
            img.loading = "lazy";
            img.addEventListener("error", () => {
              button.remove();
              updateCount();
            });

            button.appendChild(img);
            button.addEventListener("click", () => {
              const index = photos.indexOf(item.name);
              if (index >= 0) openPhoto(index);
            });
            grid.appendChild(button);
          } else {
            const wrapper = document.createElement("div");
            wrapper.className = "video-tile";

            const video = document.createElement("video");
            video.src = fileUrl(item.name);
            video.controls = true;
            video.preload = "metadata";
            video.playsInline = true;
            video.setAttribute("aria-label", "Video abspielen");

            wrapper.appendChild(video);
            grid.appendChild(wrapper);
          }
        });

        updateCount();
      } catch (error) {
        console.error("Galerie konnte nicht geladen werden:", error);
        count.textContent = "Medienliste fehlt";
        status.textContent =
          "Die Medienliste konnte nicht geladen werden. Bitte prüfen, ob bilder.json vorhanden ist und der GitHub-Workflow erfolgreich war.";
      }
    }

    function updateCount() {
      const number = grid.children.length;
      count.textContent = number + (number === 1 ? " Medium" : " Medien");
    }

    loadMedia();
  </script>
</body>
</html>
