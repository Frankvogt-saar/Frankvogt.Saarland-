
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Saiteninstrumente – Frank Vogt</title>
  <link rel="stylesheet" href="../../../style.css">

  <style>
    .gallery-status {
      color: var(--muted);
      margin-top: 18px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    .media-grid .tile {
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }

    .media-grid .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #111;
    }

    .video-tile {
      min-width: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #090b0e;
      border: 1px solid var(--accent);
    }

    .video-tile video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #090b0e;
    }

    .media-grid button {
      cursor: pointer;
    }

    .media-grid .tile:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <nav class="nav">
    <a class="logo" href="../../../">Frank Vogt</a>

    <button
      class="menu"
      id="menuButton"
      type="button"
      aria-label="Menü öffnen"
      aria-expanded="false"
      aria-controls="navlinks"
    >☰</button>

    <div class="navlinks" id="navlinks">
      <a href="../../../">Startseite</a>
      <a href="../../../Fotografie/">Fotografie</a>
      <a href="../../../Fahrzeuge/">Fahrzeuge</a>
      <a href="../../../Holzwerken/">Holzwerken</a>
      <a href="../../../Musik/">Musik</a>
    </div>
  </nav>

  <div class="breadcrumb" id="breadcrumb"></div>

  <main class="gallery">
    <div class="gallery-head">
      <div>
        <div class="eyebrow">Frank Vogt · Fotogalerie</div>
        <h2>Saiteninstrumente</h2>
      </div>

      <div class="count" id="mediaCount">Medien werden geladen …</div>
    </div>

    <p class="lead">
      Fotos und Videos aus der Kategorie Saiteninstrumente.
    </p>

    <div
      class="grid media-grid"
      id="mediaGrid"
      aria-label="Foto- und Videogalerie"
    ></div>

    <p class="gallery-status" id="galleryStatus" role="status">
      Medien werden geladen …
    </p>
  </main>

  <footer>Frank Vogt · Fotogalerie</footer>

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-label="Bildansicht"
    aria-modal="true"
  >
    <button
      class="close"
      id="closeButton"
      type="button"
      aria-label="Schließen"
    >×</button>

    <button
      class="prev"
      id="prevButton"
      type="button"
      aria-label="Vorheriges Foto"
    >‹</button>

    <img id="largeImage" alt="Foto in Großansicht">

    <button
      class="next"
      id="nextButton"
      type="button"
      aria-label="Nächstes Foto"
    >›</button>
  </div>

  <script>
    "use strict";

    // Ordnerstruktur dieser index.html
    const ROOT = "../../../";
    const FOLDER = "Musik/Instrumentenbau/Saiteninstrumente";

    const grid = document.getElementById("mediaGrid");
    const count = document.getElementById("mediaCount");
    const status = document.getElementById("galleryStatus");
    const lightbox = document.getElementById("lightbox");
    const largeImage = document.getElementById("largeImage");

    const menuButton = document.getElementById("menuButton");
    const navlinks = document.getElementById("navlinks");

    let photos = [];
    let current = 0;

    // Ordner und Dateinamen korrekt für URLs kodieren.
    function folderUrl(folder) {
      return ROOT +
        folder.split("/").map(encodeURIComponent).join("/") +
        "/";
    }

    function fileUrl(name) {
      return folderUrl(FOLDER) +
        name.split("/").map(encodeURIComponent).join("/");
    }

    // Navigation auf kleinen Bildschirmen.
    menuButton.addEventListener("click", () => {
      const isOpen = navlinks.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "Menü schließen" : "Menü öffnen"
      );
    });

    // Breadcrumb automatisch erstellen.
    const crumb = document.getElementById("breadcrumb");
    const home = document.createElement("a");

    home.href = ROOT;
    home.textContent = "Startseite";
    crumb.appendChild(home);

    let accumulated = "";

    FOLDER.split("/").forEach((part, index, parts) => {
      crumb.append(" / ");

      accumulated += (accumulated ? "/" : "") + part;

      if (index < parts.length - 1) {
        const link = document.createElement("a");
        link.href = folderUrl(accumulated);
        link.textContent = part;
        crumb.appendChild(link);
      } else {
        crumb.appendChild(document.createTextNode(part));
      }
    });

    // Lightbox: Fotos öffnen und durch Fotos blättern.
    function openPhoto(index) {
      if (!photos.length) return;

      current = (index + photos.length) % photos.length;
      largeImage.src = fileUrl(photos[current]);

      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
      document.getElementById("closeButton").focus();
    }

    function closePhoto() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
      largeImage.removeAttribute("src");
    }

    document.getElementById("closeButton")
      .addEventListener("click", closePhoto);

    document.getElementById("prevButton")
      .addEventListener("click", () => openPhoto(current - 1));

    document.getElementById("nextButton")
      .addEventListener("click", () => openPhoto(current + 1));

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closePhoto();
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;

      if (event.key === "Escape") closePhoto();
      if (event.key === "ArrowLeft") openPhoto(current - 1);
      if (event.key === "ArrowRight") openPhoto(current + 1);
    });

    // JSON-Dateien laden und Medien anzeigen.
    async function loadMedia() {
      try {
        const baseUrl = folderUrl(FOLDER);

        const imageResponse = await fetch(
          baseUrl + "bilder.json",
          { cache: "no-store" }
        );

        if (!imageResponse.ok) {
          throw new Error(
            "bilder.json konnte nicht geladen werden (HTTP " +
            imageResponse.status + ")."
          );
        }

        const imageData = await imageResponse.json();

        if (!Array.isArray(imageData)) {
          throw new Error("bilder.json enthält keine gültige Liste.");
        }

        // videos.json ist optional.
        const videoResponse = await fetch(
          baseUrl + "videos.json",
          { cache: "no-store" }
        );

        let videoData = [];

        if (videoResponse.ok) {
          videoData = await videoResponse.json();

          if (!Array.isArray(videoData)) {
            videoData = [];
          }
        }

        // Nur gültige Dateinamen übernehmen.
        photos = imageData.filter(name =>
          typeof name === "string" &&
          /\.(jpe?g|png|gif|webp|avif)$/i.test(name)
        );

        const videos = videoData.filter(name =>
          typeof name === "string" &&
          /\.mp4$/i.test(name)
        );

        // Fotos und Videos gemeinsam alphabetisch sortieren.
        const media = [
          ...photos.map(name => ({
            name,
            type: "image"
          })),

          ...videos.map(name => ({
            name,
            type: "video"
          }))
        ].sort((a, b) =>
          a.name.localeCompare(b.name, "de", {
            numeric: true,
            sensitivity: "base"
          })
        );

        grid.replaceChildren();

        count.textContent =
          media.length +
          (media.length === 1 ? " Medium" : " Medien");

        if (media.length === 0) {
          status.textContent =
            "Keine unterstützten Fotos oder MP4-Videos gefunden.";
          return;
        }

        status.textContent = "";

        media.forEach(item => {
          if (item.type === "image") {
            const button = document.createElement("button");
            button.className = "tile";
            button.type = "button";
            button.setAttribute(
              "aria-label",
              "Foto groß öffnen"
            );

            const img = document.createElement("img");
            img.src = fileUrl(item.name);
            img.alt = "";
            img.loading = "lazy";
            img.decoding = "async";

            img.addEventListener("error", () => {
              console.error(
                "Bild konnte nicht geladen werden:",
                img.src
              );
              button.remove();
              updateCount();
            });

            button.appendChild(img);

            button.addEventListener("click", () => {
              const index = photos.indexOf(item.name);

              if (index !== -1) {
                openPhoto(index);
              }
            });

            grid.appendChild(button);
          } else {
            const wrapper = document.createElement("div");
            wrapper.className = "video-tile";

            const video = document.createElement("video");
            video.src = fileUrl(item.name);
            video.controls = true;
            video.preload = "metadata";
            video.playsInline = true;
            video.setAttribute(
              "aria-label",
              "Video abspielen"
            );

            // Video kann direkt in der Kachel abgespielt werden.
            wrapper.appendChild(video);
            grid.appendChild(wrapper);

            video.addEventListener("error", () => {
              console.error(
                "Video konnte nicht geladen werden:",
                video.src
              );
            });
          }
        });

        updateCount();

      } catch (error) {
        console.error("Fehler beim Laden der Galerie:", error);

        count.textContent = "Medienliste fehlt";
        status.textContent =
          "Die Medienliste konnte nicht geladen werden. " +
          "Bitte prüfen, ob bilder.json vorhanden ist " +
          "und der GitHub-Workflow erfolgreich ausgeführt wurde.";
      }
    }

    function updateCount() {
      const number = grid.children.length;

      count.textContent =
        number + (number === 1 ? " Medium" : " Medien");
    }

    loadMedia();
  </script>
</body>
</html>
