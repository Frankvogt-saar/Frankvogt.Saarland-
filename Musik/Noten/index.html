
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noten – Frank Vogt</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .note-tile {
      display: block;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
    }
    .note-tile:hover { border-color: var(--accent); }
    .note-tile img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      background: #090b0e;
    }
    .note-tile p {
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .gallery-status { color: var(--muted); margin-top: 18px; }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="../../">Frank Vogt</a>
    <button class="menu" id="menuButton" type="button"
      aria-label="Menü öffnen">☰</button>
    <div class="navlinks" id="navlinks">
      <a href="../../">Startseite</a>
      <a href="../../Fotografie/">Fotografie</a>
      <a href="../../Fahrzeuge/">Fahrzeuge</a>
      <a href="../../Holzwerken/">Holzwerken</a>
      <a href="../">Musik</a>
    </div>
  </nav>

  <div class="breadcrumb">
    <a href="../../">Startseite</a> /
    <a href="../">Musik</a> / Noten
  </div>

  <main class="gallery">
    <div class="gallery-head">
      <div>
        <div class="eyebrow">Frank Vogt · Fotogalerie</div>
        <h2>3.2 Noten</h2>
      </div>
      <div class="count" id="mediaCount">Medien werden geladen …</div>
    </div>

    <p class="lead">Notenblätter und musikalische Sammlungen.</p>
    <div class="note-grid" id="noteGrid"></div>
    <p class="gallery-status" id="galleryStatus" role="status">
      Medien werden geladen …
    </p>
  </main>

  <footer>Frank Vogt · Fotogalerie</footer>

  <script>
    const ROOT = "../../";
    const FOLDER = "Musik/Noten";
    const grid = document.getElementById("noteGrid");
    const count = document.getElementById("mediaCount");
    const status = document.getElementById("galleryStatus");

    function fileUrl(name) {
      return ROOT + FOLDER.split("/")
        .map(encodeURIComponent).join("/") + "/" +
        name.split("/").map(encodeURIComponent).join("/");
    }

    document.getElementById("menuButton")
      .addEventListener("click", () => {
        document.getElementById("navlinks").classList.toggle("open");
      });

    async function loadNotes() {
      try {
        const response = await fetch(
          ROOT + FOLDER + "/bilder.json",
          { cache: "no-store" }
        );

        if (!response.ok) throw new Error("bilder.json fehlt");

        const files = await response.json();
        if (!Array.isArray(files)) throw new Error("Ungültige Medienliste");

        const images = files.filter(name =>
          typeof name === "string" &&
          /\.(jpe?g|png|gif|webp|avif)$/i.test(name)
        );

        grid.replaceChildren();
        count.textContent = images.length +
          (images.length === 1 ? " Bild" : " Bilder");

        if (!images.length) {
          status.textContent =
            "Noch keine Bilder von Notenblättern vorhanden.";
          return;
        }

        status.textContent = "";

        images.forEach(name => {
          const link = document.createElement("a");
          link.className = "note-tile";
          link.href = fileUrl(name);
          link.target = "_blank";
          link.rel = "noopener";

          const img = document.createElement("img");
          img.src = fileUrl(name);
          img.alt = "Notenblatt";
          img.loading = "lazy";

          const caption = document.createElement("p");
          caption.textContent = "Notenblatt";

          link.append(img, caption);
          grid.appendChild(link);
        });
      } catch (error) {
        console.error(error);
        count.textContent = "Medienliste fehlt";
        status.textContent =
          "Die Notenliste konnte nicht geladen werden. " +
          "Bitte den GitHub-Workflow prüfen.";
      }
    }

    loadNotes();
  </script>
</body>
</html>
