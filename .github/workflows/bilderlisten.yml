name: Fotogalerien automatisch erstellen

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  galerien:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Medienlisten und Galerie-Seiten erstellen
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = [Path('Fotografie'), Path('Fahrzeuge'), Path('Holzwerken'), Path('Musik')]
          image_extensions = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.avif'}
          video_extensions = {'.mp4'}

          # Einheitliche Vorlage für jede Unterordner-Galerie.
          template = '''<!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
            <title>__TITLE__ – Frank Vogt</title>
            <link rel="stylesheet" href="__ROOT__style.css">
            <style>
              .gallery-status{color:var(--muted);margin-top:18px}
              .tile img{object-fit:cover;background:#111}
              .video-tile{min-width:0;overflow:hidden;border-radius:8px;background:#090b0e;border:1px solid var(--accent)}
              .video-tile video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#090b0e}
              .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
            </style>
          </head>
          <body>
            <nav class="nav"><a class="logo" href="__ROOT__">Frank Vogt</a>
              <button class="menu" id="menuButton" aria-label="Menü öffnen">☰</button>
              <div class="navlinks" id="navlinks">
                <a href="__ROOT__">Startseite</a><a href="__ROOT__Fotografie/">Fotografie</a>
                <a href="__ROOT__Fahrzeuge/">Fahrzeuge</a><a href="__ROOT__Holzwerken/">Holzwerken</a><a href="__ROOT__Musik/">Musik</a>
              </div>
            </nav>
            <div class="breadcrumb" id="breadcrumb"></div>
            <main class="gallery">
              <div class="gallery-head"><div><div class="eyebrow">Frank Vogt · Fotogalerie</div><h2>__TITLE__</h2></div><div class="count" id="mediaCount">Medien werden geladen …</div></div>
              <p class="lead">Fotos und Videos aus der Kategorie __TITLE__.</p>
              <div class="grid media-grid" id="mediaGrid" aria-label="Foto- und Videogalerie"></div>
              <p class="gallery-status" id="galleryStatus">Medien werden geladen …</p>
            </main>
            <footer>Frank Vogt · Fotogalerie</footer>
            <div class="lightbox" id="lightbox" aria-label="Bildansicht">
              <button class="close" id="closeButton" aria-label="Schließen">×</button><button class="prev" id="prevButton" aria-label="Vorheriges Foto">‹</button>
              <img id="largeImage" alt="Foto in Großansicht"><button class="next" id="nextButton" aria-label="Nächstes Foto">›</button>
            </div>
            <script>
            const ROOT="__ROOT__", FOLDER="__FOLDER__";
            const grid=document.getElementById('mediaGrid'), count=document.getElementById('mediaCount'), status=document.getElementById('galleryStatus');
            const lightbox=document.getElementById('lightbox'), largeImage=document.getElementById('largeImage');
            let photos=[], current=0;
            function fileUrl(name){return name.split('/').map(p=>encodeURIComponent(p)).join('/')}
            function openPhoto(i){if(!photos.length)return;current=(i+photos.length)%photos.length;largeImage.src=fileUrl(photos[current]);lightbox.classList.add('open');document.body.style.overflow='hidden'}
            function closePhoto(){lightbox.classList.remove('open');document.body.style.overflow='';largeImage.removeAttribute('src')}
            document.getElementById('closeButton').addEventListener('click',closePhoto);
            document.getElementById('prevButton').addEventListener('click',()=>openPhoto(current-1));
            document.getElementById('nextButton').addEventListener('click',()=>openPhoto(current+1));
            lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePhoto()});
            document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto();if(lightbox.classList.contains('open')&&e.key==='ArrowLeft')openPhoto(current-1);if(lightbox.classList.contains('open')&&e.key==='ArrowRight')openPhoto(current+1)});
            document.getElementById('menuButton').addEventListener('click',()=>document.getElementById('navlinks').classList.toggle('open'));
            const crumb=document.getElementById('breadcrumb'), home=document.createElement('a');home.href=ROOT;home.textContent='Startseite';crumb.appendChild(home);
            let accum='';FOLDER.split('/').filter(Boolean).forEach((part,i,parts)=>{crumb.append(' / ');accum+=(accum?'/':'')+part;if(i<parts.length-1){const a=document.createElement('a');a.href=ROOT+accum.split('/').map(encodeURIComponent).join('/')+'/';a.textContent=part;crumb.appendChild(a)}else crumb.append(document.createTextNode(part))});
            async function loadMedia(){try{
              const [ir,vr]=await Promise.all([fetch('bilder.json',{cache:'no-store'}),fetch('videos.json',{cache:'no-store'})]);
              if(!ir.ok)throw new Error('bilder.json fehlt');const imageFiles=await ir.json(), videoFiles=vr.ok?await vr.json():[];
              photos=imageFiles.filter(n=>typeof n==='string');const media=[...photos.map(name=>({name,type:'image'})),...videoFiles.filter(n=>typeof n==='string'&&n.toLowerCase().endsWith('.mp4')).map(name=>({name,type:'video'}))].sort((a,b)=>a.name.localeCompare(b.name,'de',{numeric:true,sensitivity:'base'}));
              grid.replaceChildren();count.textContent=media.length+(media.length===1?' Medium':' Medien');
              if(!media.length){status.textContent='In diesem Ordner wurden noch keine unterstützten Fotos oder MP4-Videos gefunden.';return}status.textContent='';
              media.forEach(item=>{if(item.type==='image'){const b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label','Foto groß öffnen');const img=document.createElement('img');img.src=fileUrl(item.name);img.alt='';img.loading='lazy';img.addEventListener('error',()=>b.remove());b.appendChild(img);b.addEventListener('click',()=>{const i=photos.indexOf(item.name);if(i>=0)openPhoto(i)});grid.appendChild(b)}else{const wrap=document.createElement('div');wrap.className='video-tile';const v=document.createElement('video');v.src=fileUrl(item.name);v.controls=true;v.preload='metadata';v.playsInline=true;v.setAttribute('aria-label','Video abspielen');wrap.appendChild(v);grid.appendChild(wrap)}})
            }catch(e){count.textContent='Medienliste fehlt';status.textContent='Die automatische Medienliste konnte nicht geladen werden. Bitte im GitHub-Reiter Actions prüfen, ob der Workflow erfolgreich war.';console.error(e)}}
            loadMedia();
            </script>
          </body></html>'''

          for root in roots:
              if not root.is_dir():
                  print(f'Ordner nicht gefunden: {root}')
                  continue
              # Kategorie-Startseiten selbst bleiben unverändert.
              for folder in sorted((p for p in root.rglob('*') if p.is_dir()), key=lambda p: str(p).lower()):
                  images = sorted((p.name for p in folder.iterdir() if p.is_file() and p.suffix.lower() in image_extensions), key=str.lower)
                  videos = sorted((p.name for p in folder.iterdir() if p.is_file() and p.suffix.lower() in video_extensions), key=str.lower)
                  (folder / 'bilder.json').write_text(json.dumps(images, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  (folder / 'videos.json').write_text(json.dumps(videos, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  depth = len(folder.parts)
                  root_prefix = '../' * depth
                  title = folder.name.replace('_', ' ').replace('-', ' ')
                  html = template.replace('__ROOT__', root_prefix).replace('__TITLE__', title).replace('__FOLDER__', folder.as_posix())
                  (folder / 'index.html').write_text(html, encoding='utf-8')
                  print(f'{folder}: {len(images)} Fotos, {len(videos)} Videos; index.html erstellt')
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Galerieseiten und Medienlisten automatisch aktualisieren"
            git push
          fi
