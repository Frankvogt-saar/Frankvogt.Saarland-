
name: Bilderlisten aktualisieren

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/bilder.json"
      - "**/videos.json"

permissions:
  contents: write

jobs:
  bilderlisten:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bilder- und Videolisten erstellen
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          folders = [
              Path("Fotografie"),
              Path("Fahrzeuge"),
              Path("Musik"),
              Path("Holzwerken"),
          ]

          image_extensions = {
              ".jpg", ".jpeg", ".png", ".gif",
              ".webp", ".bmp", ".avif"
          }

          video_extensions = {".mp4"}

          for root in folders:
              if not root.is_dir():
                  print(f"Ordner nicht gefunden: {root}")
                  continue

              # Alle Unterordner automatisch berücksichtigen.
              gallery_folders = [root] + sorted(
                  (p for p in root.rglob("*") if p.is_dir()),
                  key=lambda p: str(p).lower()
              )

              for folder in gallery_folders:
                  images = sorted(
                      (
                          p.name for p in folder.iterdir()
                          if p.is_file()
                          and p.suffix.lower() in image_extensions
                      ),
                      key=str.lower
                  )

                  videos = sorted(
                      (
                          p.name for p in folder.iterdir()
                          if p.is_file()
                          and p.suffix.lower() in video_extensions
                      ),
                      key=str.lower
                  )

                  (folder / "bilder.json").write_text(
                      json.dumps(images, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8"
                  )

                  (folder / "videos.json").write_text(
                      json.dumps(videos, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8"
                  )

                  print(
                      f"{folder}: {len(images)} Bilder, "
                      f"{len(videos)} Videos"
                  )
          PY

      - name: Listen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Bilder- und Videolisten automatisch aktualisieren"
            git push
          fi
